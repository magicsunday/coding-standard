# Canonical layered architecture for magicsunday modules — the shared Deptrac
# ruleset. A consumer imports this file and only adds its own `paths`; the layer
# definitions and the allowed-dependency ruleset live here, in one place.
#
# Layers are matched by NAMESPACE SEGMENT via a `directory` collector (`.*/Model/.*`,
# `.*/Repository/.*`, …), not by the repository root, so the same ruleset ports
# across every module WITHOUT renaming anything: a class under `<any>/Repository/`
# lands in the `Repository` layer wherever the module lives. A `directory` collector
# matches only the files inside the analysed `paths` (a consumer's `src`), so a
# REFERENCED third-party class — which Deptrac never analyses and therefore has no
# file path for — falls to "uncovered" naturally. That is the whole reason the
# collector is path-based and not a `classNameRegex` on the FQCN: a class-name regex
# also matches vendor FQCNs carrying a canonical segment (`Illuminate\Support\…`,
# `Fisharebest\…\Module\…`) and, because Deptrac cannot resolve a referenced class's
# path to exclude it, would file that vendor class into the consumer's layer and
# report a false forbidden edge. Only the ruleset below is enforced; a dependency on
# an uncovered class does not fail the run (do NOT enable `--fail-on-uncovered`
# wholesale — every external dependency is uncovered).
#
# The ruleset is deliberately PERMISSIVE at this stage: it forbids only the
# uncontroversial upward edges every layered design agrees are wrong (a leaf
# depending on a higher layer, anything depending on the composition root). The
# domain core — Enum, Model, Contract, Configuration — is left mutually permissive
# on purpose: a Model legitimately implements a Contract marker interface whose
# signature references a Model, which at layer granularity is a cycle that must
# not be forbidden. Tighten individual edges later, per module, only once a
# `deptrac analyse` dry-run proves the stricter edge is violation-free.
#
# CONSTRAINT — canonical segments must not NEST. Because a layer is matched by its
# bare `/Segment/` path, a class whose path nests one canonical segment under
# another (`…/Service/Monitoring/Contract/Foo.php`) matches BOTH layers and Deptrac
# warns "class grouped in multiple layers". Keep each canonical role at a single
# path level. A consumer that maps a non-canonical namespace onto a layer (Deptrac
# merges a same-named layer's collectors with this import) should anchor its own
# collector to the ROOT level (`.*/Normalization/[^/]+$`) so a nested canonical
# sub-namespace still falls to the shared layer.
#
# @author  Rico Sonntag <mail@ricosonntag.de>
# @license https://opensource.org/licenses/MIT The MIT License
# @link    https://github.com/magicsunday/coding-standard/
deptrac:
    layers:
        -
            name: Enum
            collectors:
                -
                    type: directory
                    value: '.*/Enum/.*'
        -
            name: Model
            collectors:
                -
                    type: directory
                    value: '.*/Model/.*'
        -
            name: Contract
            collectors:
                -
                    type: directory
                    value: '.*/Contract/.*'
        -
            name: Configuration
            collectors:
                -
                    type: directory
                    value: '.*/Configuration/.*'
        -
            name: Support
            collectors:
                -
                    type: directory
                    value: '.*/Support/.*'
        -
            name: Repository
            collectors:
                -
                    type: directory
                    value: '.*/Repository/.*'
        -
            name: Adapter
            collectors:
                -
                    type: directory
                    value: '.*/Adapter/.*'
        -
            name: Service
            collectors:
                -
                    type: directory
                    value: '.*/Service/.*'
        -
            name: Facade
            collectors:
                -
                    type: directory
                    value: '.*/Facade/.*'
        -
            name: Module
            collectors:
                -
                    type: directory
                    value: '.*/Module/.*'

    ruleset:
        # Domain core — mutually permissive, depends on nothing outside itself.
        # Enum is part of the core, not a pure leaf: a PHP enum may implement a
        # Contract interface or expose a Model/Configuration, so it gets the same
        # intra-core allowance as the others rather than an empty allowlist.
        Enum:
            - Model
            - Contract
            - Configuration
        Model:
            - Enum
            - Contract
            - Configuration
        Contract:
            - Enum
            - Model
            - Configuration
        Configuration:
            - Enum
            - Model
            - Contract

        # Framework-agnostic helpers — may lean on the domain core only.
        Support:
            - Enum
            - Model
            - Contract
            - Configuration

        # Infrastructure edge — data access and framework/external adapters.
        Repository:
            - Enum
            - Model
            - Contract
            - Configuration
            - Support
        Adapter:
            - Enum
            - Model
            - Contract
            - Configuration
            - Support

        # Application logic — may consume infrastructure.
        Service:
            - Enum
            - Model
            - Contract
            - Configuration
            - Support
            - Repository
            - Adapter

        # Public API / orchestration.
        Facade:
            - Enum
            - Model
            - Contract
            - Configuration
            - Support
            - Repository
            - Adapter
            - Service

        # webtrees entry point + composition root — wires everything.
        Module:
            - Enum
            - Model
            - Contract
            - Configuration
            - Support
            - Repository
            - Adapter
            - Service
            - Facade
