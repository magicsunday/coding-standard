# Canonical layered architecture for magicsunday modules — the shared Deptrac
# ruleset. A consumer imports this file and only adds its own `paths`; the layer
# definitions and the allowed-dependency ruleset live here, in one place.
#
# Layers are matched by NAMESPACE SEGMENT via a `directory` collector (`.*/Model/.*`,
# `.*/Repository/.*`, …), not by the repository root, so the same ruleset ports
# across every module WITHOUT renaming anything: a class under `<any>/Repository/`
# lands in the `Repository` layer wherever the module lives. A `directory` collector
# matches only the files inside the analysed `paths` (a consumer's `src`), so a
# REFERENCED third-party class — which Deptrac never analyses and therefore has no
# file path for — falls to "uncovered" naturally. That is the whole reason the
# collector is path-based and not a `classNameRegex` on the FQCN: a class-name regex
# also matches vendor FQCNs carrying a canonical segment (`Illuminate\Support\…`,
# `Fisharebest\…\Module\…`) and, because Deptrac cannot resolve a referenced class's
# path to exclude it, would file that vendor class into the consumer's layer and
# report a false forbidden edge. Only the ruleset below is enforced; a dependency on
# an uncovered class does not fail the run (do NOT enable `--fail-on-uncovered`
# wholesale — every external dependency is uncovered).
#
# The ruleset is STRICT and ACYCLIC. Deptrac UNITES rulesets across `imports:`, so a
# consumer can widen a shared layer but never narrow one — the shared ruleset must
# therefore be the strictest common denominator, and every edge a module needs beyond
# it is an explicit, commented widening in that module's own deptrac.yaml. The layers
# form one total order, lowest first, and a layer may depend only on layers below it:
#
#   Support < Enum < Model, Configuration < Contract < Repository, Adapter, Service
#           < Facade < Module
#
# which makes the shared graph a DAG by construction (Acyclic Dependencies Principle).
# The principles behind the order, and the measured impact on every adopter, are in
# the README's Deptrac section.
#
# CONSTRAINT — canonical segments must not NEST. Because a layer is matched by its
# bare `/Segment/` path, a class whose path nests one canonical segment under
# another (`…/Service/Monitoring/Contract/Foo.php`) matches BOTH layers and Deptrac
# warns "class grouped in multiple layers". Keep each canonical role at a single
# path level. A consumer that maps a non-canonical namespace onto a layer (Deptrac
# merges a same-named layer's collectors with this import) should anchor its own
# collector to the ROOT level (`.*/Normalization/[^/]+$`) so a nested canonical
# sub-namespace still falls to the shared layer.
#
# @author  Rico Sonntag <mail@ricosonntag.de>
# @license https://opensource.org/licenses/MIT The MIT License
# @link    https://github.com/magicsunday/coding-standard/
deptrac:
    layers:
        -
            name: Enum
            collectors:
                -
                    type: directory
                    value: '.*/Enum/.*'
        -
            name: Model
            collectors:
                -
                    type: directory
                    value: '.*/Model/.*'
        -
            name: Contract
            collectors:
                -
                    type: directory
                    value: '.*/Contract/.*'
        -
            name: Configuration
            collectors:
                -
                    type: directory
                    value: '.*/Configuration/.*'
        -
            name: Support
            collectors:
                -
                    type: directory
                    value: '.*/Support/.*'
        -
            name: Repository
            collectors:
                -
                    type: directory
                    value: '.*/Repository/.*'
        -
            name: Adapter
            collectors:
                -
                    type: directory
                    value: '.*/Adapter/.*'
        -
            name: Service
            collectors:
                -
                    type: directory
                    value: '.*/Service/.*'
        -
            name: Facade
            collectors:
                -
                    type: directory
                    value: '.*/Facade/.*'
        -
            name: Module
            collectors:
                -
                    type: directory
                    value: '.*/Module/.*'

    ruleset:
        # Generic, domain-agnostic helpers (string, array, date utilities). The bottom
        # layer: a helper that needs a domain type is domain logic and belongs above.
        Support: ~

        # Domain core. Enums are the vocabulary; models and configuration values hold
        # data in that vocabulary; contracts (ports) speak the domain types. Nothing in
        # the core depends back on a contract: an interface a model implements belongs
        # with the model (Stable Abstractions Principle).
        Enum:
            - Support
        Model:
            - Support
            - Enum
        Configuration:
            - Support
            - Enum
        Contract:
            - Support
            - Enum
            - Model
            - Configuration

        # Infrastructure edge — data access and framework/external adapters implement
        # the contracts.
        Repository:
            - Support
            - Enum
            - Model
            - Configuration
            - Contract
        Adapter:
            - Support
            - Enum
            - Model
            - Configuration
            - Contract

        # Application logic depends on contracts only, never on a concrete repository or
        # adapter (Dependency Inversion): the composition root wires those in.
        Service:
            - Support
            - Enum
            - Model
            - Configuration
            - Contract

        # Public API / orchestration — a library's entry point doubles as its
        # composition root, so it may reach the adapters it wires.
        Facade:
            - Support
            - Enum
            - Model
            - Configuration
            - Contract
            - Repository
            - Adapter
            - Service

        # webtrees entry point + composition root — wires everything.
        Module:
            - Support
            - Enum
            - Model
            - Configuration
            - Contract
            - Repository
            - Adapter
            - Service
            - Facade
