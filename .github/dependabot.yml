version: 2

# Every ecosystem sets an explicit commit-message prefix. Without one,
# Dependabot copies the patterns it detects in the history, which can produce
# `chore(deps): …` subjects and PR titles the commit-convention gate rejects.
# A prefix ending in a letter gets a colon appended:
# "Update dependencies: bump …".
updates:
    # tests/consumer/composer.json is deliberately not a second `directory` here:
    # it is a `path`-repository, `minimum-stability: dev` fixture that installs
    # this package from the working tree itself, not from a tagged release, so
    # a Dependabot PR against it would either fail to resolve or offer to bump
    # a requirement that is not a real upstream dependency. Its own require-dev
    # copy of the opt-in strict-tier packages is kept in step with composer.json's
    # suggest block by tests/check-consumer-suggest-lockstep.php instead.
    -   package-ecosystem: composer
        directory: /
        schedule:
            interval: weekly
        open-pull-requests-limit: 5
        cooldown:
            default-days: 7
        commit-message:
            prefix: "Update dependencies"
        groups:
            composer:
                patterns:
                    - "*"

    -   package-ecosystem: npm
        directory: /
        schedule:
            interval: weekly
        open-pull-requests-limit: 5
        cooldown:
            default-days: 7
        commit-message:
            prefix: "Update dependencies"
        groups:
            npm:
                patterns:
                    - "*"

    -   package-ecosystem: github-actions
        directory: /
        schedule:
            interval: weekly
        cooldown:
            default-days: 7
        commit-message:
            prefix: "Update dependencies"
        groups:
            github-actions:
                patterns:
                    - "*"
