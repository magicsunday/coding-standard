name: CI

on:
    push:
        branches: [main]
    pull_request:

permissions:
    contents: read

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

jobs:
    build:
        # Explicit, naming only matrix.php: GitHub Actions otherwise composes
        # the displayed/required-check name from EVERY matrix key, so adding
        # the `coverage` key below without this would silently rename each
        # check from "Build (8.3)" to "Build (8.3, none)" and desync it from
        # the branch protection's required status checks (verified against
        # this repo's own contexts: `gh api
        # repos/magicsunday/coding-standard/branches/main/protection --jq
        # '.required_status_checks.contexts[]?'` lists "Build (8.3)" etc.).
        name: Build (${{ matrix.php }})
        runs-on: ubuntu-latest

        strategy:
            fail-fast: false
            matrix:
                # A named `coverage` field, not a repeated `matrix.php == '8.5'`
                # comparison at each use site: the two use sites below (the
                # `coverage:` input and the PHPUnit step's `--coverage-text`
                # flag) then read the SAME source, so a future matrix edit
                # (adding/dropping/reordering a PHP version) cannot update one
                # site and silently leave the other on the old leg.
                include:
                    - php: '8.3'
                      coverage: none
                    - php: '8.4'
                      coverage: none
                    - php: '8.5'
                      coverage: xdebug

        steps:
            - name: Set up PHP version ${{ matrix.php }}
              uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
              with:
                  php-version: ${{ matrix.php }}
                  tools: composer:v2
                  # Explicit, the way the org's reusable php-quality.yml writes it
                  # (magicsunday/.github, .github/workflows/php-quality.yml — the
                  # `coverage:` expression, read 2026-08-15), except on the top
                  # matrix leg (see the matrix's own `coverage` field above).
                  # beStrictAboutCoverageMetadata's "this test executed code
                  # not listed as covered/used" check only evaluates once a
                  # driver is actually collecting data — traced against
                  # phpunit/phpunit 13.3.1's
                  # PHPUnit\Framework\TestRunner\TestRunner::run(), gated on
                  # $collectCodeCoverage; that class carries no BC promise, so
                  # re-verify at .build/vendor/phpunit/phpunit/src/Framework/
                  # TestRunner/TestRunner.php before relying on this again.
                  # Without a driver on at least one leg, a regression that
                  # sweeps test files themselves into the instrumented
                  # <source> set would stay green here undetected.
                  # requireCoverageMetadata ("does not define a coverage
                  # target") is unconditional and already enforced on every
                  # leg regardless of this setting. Leaving the input unset
                  # would make the driver state depend on the runner image
                  # rather than on a decision.
                  coverage: ${{ matrix.coverage }}

            - name: Checkout repository
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false

            - name: Validate composer.json
              run: composer validate --strict

            # The gates below run tools from this package's own .build/bin
            # (phplint, phpstan), so the root install is a prerequisite — not
            # only the fixture install further down.
            - name: Install dependencies
              run: composer install --prefer-dist --no-interaction --no-progress

            # tests/harness.sh unconditionally shells out to `node -e '…'` the
            # moment it is sourced (its degraded() bookkeeping check), not
            # lazily — so this step must run before any step that sources it,
            # directly or via a case-file it drives. Pinned the same way the js
            # job pins it (see that job's comment), rather than relying on
            # whatever the runner image happens to preinstall.
            - name: Set up Node.js
              uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
              with:
                  node-version: 24

            - name: Lint the PHP config factories
              run: composer ci:test:php:lint

            # phplint above is a syntax check only, and over a wider path set
            # (also php-cs-fixer/, rector/, templates/, tests/consumer). This
            # is the arity / argument-type / dead-code / case-folding pass —
            # over bin/ and tests/ (tests/consumer excluded) — the procedural
            # glue this package ships to consumers (bin/) and its own
            # PHPUnit test harness (tests/), which previously escaped every
            # analyser.
            - name: Statically analyse the PHP gate scripts
              run: composer ci:test:php:analyse

            # phpstan.neon's own include of phpstan/disallowed-function-calls.neon
            # has no other proof: bin/ and tests/ currently call none of the five
            # banned functions, so a broken include would leave the step above
            # silently green. CheckDisallowedCallsTest (run by the Case-folding
            # self-test step below) proves the ban LIST fires, but only through
            # tests/consumer's installed copy, never phpstan.neon itself.
            - name: PHP gate self-analysis self-test
              run: composer ci:test:php:analyse-cases

            - name: Validate the JSON configs
              run: composer ci:test:json

            # The gate above discovers files rather than reading a hand-kept
            # list, and only ever takes the happy path against this
            # repository's own tree. These cases prove it still rejects a
            # malformed, a missing and an unreadable file, that its discovery
            # prunes vendored/installed trees and VCS metadata, and that a
            # consumer-controlled file name cannot forge a workflow command in
            # the report.
            - name: JSON lint gate self-test
              run: composer ci:test:json-cases

            # Only the leg whose matrix `coverage` field is non-`none` has a
            # driver active (see the `coverage:` step above) — --coverage-text
            # there is what makes beStrictAboutCoverageMetadata actually
            # evaluate, which is the enforcement this flag exists for, not a
            # human-facing report; the other legs run the bare command.
            - name: PHPUnit
              run: composer ci:test:phpunit${{ matrix.coverage != 'none' && ' -- --coverage-text' || '' }}

            # The steps below install this package into a fixture project exactly the
            # way a real repository consumes it, then run each shared config against
            # the fixture source. This is what proves the relative `includes` in
            # base.neon resolve from an installed vendor layout, that every parameter
            # is schema-valid in Rector's PHPStan context too, and that the factories
            # return what the consumers expect.
            - name: Consumer smoke - install the package as a consumer would
              working-directory: tests/consumer
              run: composer install --prefer-dist --no-interaction --no-progress

            - name: Consumer smoke - PHPStan with the shared base config
              working-directory: tests/consumer
              run: .build/bin/phpstan analyse --configuration phpstan.neon --memory-limit=-1 --error-format=github

            - name: Consumer smoke - php-cs-fixer with the shared ruleset
              working-directory: tests/consumer
              run: .build/bin/php-cs-fixer fix --config .php-cs-fixer.dist.php --dry-run --diff

            - name: Consumer smoke - Rector with the shared rule sets
              working-directory: tests/consumer
              run: .build/bin/rector process --config rector.php --dry-run

            # Exercise the case-folding config via CheckDisallowedCallsTest, which
            # self-skipped when the plain "PHPUnit" step above ran — tests/consumer
            # was not installed yet at that point. Positioned here, after Consumer
            # smoke install, so it actually runs: first proves base.neon alone is
            # clean on the fixture, then that base.neon + disallowed-calls.neon
            # reports all five banned functions, then that the same five come back
            # through strict.neon, the only place that tier is loaded at all.
            - name: Case-folding self-test
              run: composer ci:test:disallowed-calls

            # This step sits AFTER the consumer smoke steps on purpose. A failing
            # step skips every later one, and what it catches is a documentation
            # mismatch — a release that
            # bumps package.json's version without the README pin. Ahead of the
            # consumer smoke, that one-line defect would suppress PHPStan, Rector
            # and php-cs-fixer against the installed fixture on all three legs,
            # exactly on the release commit where that answer matters most.
            #
            # The npm tag is hand-written in the README and repeated in
            # package.json, so a release that bumps only one of them leaves the
            # install instructions pointing at a tag without the fix.
            - name: Version lockstep gate
              run: composer ci:test:version

            # tests/consumer/composer.json's require-dev hand-copies each
            # opt-in strict-tier package's version constraint from composer.json's
            # own suggest block, so the Case-folding self-test step above (the
            # only place strict.neon is loaded — see its own comment) proves that
            # tier against the same version the suggest text tells a real consumer
            # to install. Nothing else ties the two copies together — a suggest
            # bump with no matching fixture bump would keep that step green on the OLD
            # major while the install text already promises the new one.
            - name: Consumer suggest lockstep gate
              run: composer ci:test:consumer-suggest-lockstep

            # GH-38: asserts this repository's own .gitattributes export-ignores
            # every templates/gitattributes entry that names a path this
            # repository actually has, so a future template addition cannot
            # silently leave this package's own dist archive out of step.
            - name: Gitattributes lockstep gate
              run: composer ci:test:gitattributes

            # The gate above runs against this repository, where every
            # applicable entry already agrees — so it only ever takes the happy
            # path and would stay green if it lost the ability to fail. These
            # cases put it in each failing state on purpose.
            - name: Gitattributes lockstep gate self-test
              run: composer ci:test:gitattributes-lockstep

            # GH-42: the version lockstep gate above proves package.json's
            # `version` and every README pin agree with EACH OTHER — both live
            # inside this repository, so it cannot see whether the tag they
            # name actually resolves on GitHub, or resolves to a commit this
            # branch's own history never contains (see
            # tests/check-release-tag-lockstep.php's own docblock for the real
            # incident this closes, GH-31, and for why it checks ANCESTRY
            # rather than a tree match against HEAD — a tree-equality design
            # shipped first and was caught, on this repository's own history,
            # false-failing every ordinary post-release commit). `if:
            # github.event_name == 'push'` on purpose: the release PR is the
            # one place the tag legitimately does not exist yet, so running
            # this on `pull_request` would block every release.
            - name: Release tag lockstep gate
              if: github.event_name == 'push'
              run: composer ci:test:release-tag

            # No `if` guard here, unlike the step above: this is a fixture-
            # driven self-test against disposable local git repositories, not
            # a check of this repository's own real tags, so it neither needs
            # nor touches the real network and stays useful on every
            # pull_request too.
            - name: Release tag lockstep gate self-test
              run: composer ci:test:release-tag-lockstep

    js:
        name: JS/TS configs
        runs-on: ubuntu-latest

        steps:
            - name: Checkout repository
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false

            # Pinned to the `devEngines` floor rather than `lts/*`: a floating LTS
            # alias silently moves to the next major every October, which is the
            # same drift the tool version pins exist to prevent.
            - name: Set up Node.js
              uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
              with:
                  node-version: 24

            # The PHP consumer smoke has no JS counterpart, which is how an
            # unloadable biome/base.json shipped: `ci:test:json` proves the file
            # parses as JSON, but Biome rejects an unknown key outright, so a
            # perfectly valid JSON document can still fail every consumer. This
            # packs the package as npm ships it, installs it into a throwaway
            # consumer and runs Biome and tsc against the shared configs — with
            # controls proving a rule violation and an unchecked index are
            # actually rejected, so the gate cannot pass vacuously.
            - name: JS consumer smoke
              run: npm run --silent ci:test:js
