name: CI

on:
    push:
        branches: [main]
    pull_request:

permissions:
    contents: read

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

jobs:
    build:
        name: Build
        runs-on: ubuntu-latest

        strategy:
            fail-fast: false
            matrix:
                php: ['8.3', '8.4', '8.5']

        steps:
            - name: Set up PHP version ${{ matrix.php }}
              uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
              with:
                  php-version: ${{ matrix.php }}
                  tools: composer:v2
                  # Explicit, the way the org's reusable php-quality.yml writes it
                  # (magicsunday/.github, .github/workflows/php-quality.yml — the
                  # `coverage:` expression, read 2026-08-15). This repository runs
                  # no PHPUnit suite and no Infection — phpunit/phpunit IS in
                  # `require`, as the tool consumers get — so it is always that
                  # workflow's "every other leg" case, and leaving the input unset
                  # makes the driver state depend on the runner image rather than on
                  # a decision. Measured cost of a loaded Xdebug on this repository's
                  # PHP-executing harnesses: 5.6 s to 9.5 s. No count is given —
                  # every attempt at one needed a grep that disagreed with the next
                  # reader's, which is a sign the number is not the point.
                  coverage: none

            - name: Checkout repository
              uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
              with:
                  persist-credentials: false

            - name: Validate composer.json
              run: composer validate --strict

            # The gates below run tools from this package's own .build/bin
            # (phplint), so the root install is a prerequisite — not only the
            # fixture install further down.
            - name: Install dependencies
              run: composer install --prefer-dist --no-interaction --no-progress

            - name: Lint the PHP config factories
              run: composer ci:test:php:lint

            - name: Validate the JSON configs
              run: composer ci:test:json

            # Exercise the template lockstep gate: the fixture-driven harness proves
            # it ACCEPTS the canon and REJECTS every drift class (loosened strict
            # flags, section-scoping edge cases, the stale jscpd v4 reporter), so the
            # gate is proven not to pass vacuously.
            - name: Lockstep gate self-test
              run: composer ci:test:templates

            # Exercise the phpat subject-liveness guard: the harness proves it accepts
            # an ArchitectureTest whose rule subjects all match a real class and rejects
            # the vacuous cases (a trait-only namespace subject, an empty namespace, a
            # missing classname target, an unparseable subject).
            - name: phpat subject-liveness self-test
              run: composer ci:test:phpat-subjects

            # The steps below install this package into a fixture project exactly the
            # way a real repository consumes it, then run each shared config against
            # the fixture source. This is what proves the relative `includes` in
            # base.neon resolve from an installed vendor layout, that every parameter
            # is schema-valid in Rector's PHPStan context too, and that the factories
            # return what the consumers expect.
            - name: Consumer smoke - install the package as a consumer would
              working-directory: tests/consumer
              run: composer install --prefer-dist --no-interaction --no-progress

            - name: Consumer smoke - PHPStan with the shared base config
              working-directory: tests/consumer
              run: .build/bin/phpstan analyse --configuration phpstan.neon --memory-limit=-1 --error-format=github

            - name: Consumer smoke - php-cs-fixer with the shared ruleset
              working-directory: tests/consumer
              run: .build/bin/php-cs-fixer fix --config .php-cs-fixer.dist.php --dry-run --diff

            - name: Consumer smoke - Rector with the shared rule sets
              working-directory: tests/consumer
              run: .build/bin/rector process --config rector.php --dry-run

            # Exercise the case-folding config: the harness first proves base.neon
            # alone is clean on the fixture, then that base.neon + disallowed-calls.neon
            # reports all five banned functions, then that the same five come back
            # through strict.neon. Without the control run a config that loaded but
            # matched nothing would pass as "PHPStan is green"; the strict run is the
            # only place that tier is loaded at all, so it doubles as its smoke test.
            - name: Case-folding self-test
              run: composer ci:test:disallowed-calls

            # These two sit LAST on purpose. A failing step skips every later one,
            # and what they catch is a documentation mismatch — a release that
            # bumps package.json's version without the README pin. Ahead of the
            # consumer smoke, that one-line defect would suppress PHPStan, Rector
            # and php-cs-fixer against the installed fixture on all three legs,
            # exactly on the release commit where that answer matters most.
            #
            # The npm tag is hand-written in the README and repeated in
            # package.json, so a release that bumps only one of them leaves the
            # install instructions pointing at a tag without the fix.
            - name: Version lockstep gate
              run: composer ci:test:version

            # The gate above runs against this repository, where every copy of
            # the version already agrees — so it only ever takes the happy path
            # and would stay green if it lost the ability to fail. These cases
            # put it in each failing state on purpose.
            - name: Version lockstep gate self-test
              run: composer ci:test:version-lockstep

    js:
        name: JS/TS configs
        runs-on: ubuntu-latest

        steps:
            - name: Checkout repository
              uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
              with:
                  persist-credentials: false

            # Pinned to the `devEngines` floor rather than `lts/*`: a floating LTS
            # alias silently moves to the next major every October, which is the
            # same drift the tool version pins exist to prevent.
            - name: Set up Node.js
              uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
              with:
                  node-version: 24

            # The PHP consumer smoke has no JS counterpart, which is how an
            # unloadable biome/base.json shipped: `ci:test:json` proves the file
            # parses as JSON, but Biome rejects an unknown key outright, so a
            # perfectly valid JSON document can still fail every consumer. This
            # packs the package as npm ships it, installs it into a throwaway
            # consumer and runs Biome and tsc against the shared configs — with
            # controls proving a rule violation and an unchecked index are
            # actually rejected, so the gate cannot pass vacuously.
            - name: JS consumer smoke
              run: npm run --silent ci:test:js
