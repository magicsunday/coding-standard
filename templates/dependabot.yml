version: 2

# Every ecosystem sets an explicit commit-message prefix, so that Dependabot
# never adopts a `chore(deps): …` style from the history, which the
# commit-convention gate rejects.
#
# Keep one entry per ecosystem the repository uses and drop the others. A new
# entry needs its own `commit-message.prefix`, which `check-consumer-config.php`
# enforces.
updates:
    -   package-ecosystem: composer
        directory: /
        schedule:
            interval: weekly
        open-pull-requests-limit: 5
        cooldown:
            default-days: 7
        commit-message:
            prefix: "Update dependencies"
        groups:
            composer:
                patterns:
                    - "*"

    -   package-ecosystem: npm
        directory: /
        schedule:
            interval: weekly
        open-pull-requests-limit: 5
        cooldown:
            default-days: 7
        commit-message:
            prefix: "Update dependencies"
        groups:
            npm:
                patterns:
                    - "*"

    -   package-ecosystem: github-actions
        directory: /
        schedule:
            interval: weekly
        cooldown:
            default-days: 7
        commit-message:
            prefix: "Update dependencies"
        groups:
            github-actions:
                patterns:
                    - "*"
